name: Docs check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # 429: GitHub rate-limits link checkers on shared runners
          args: --no-progress --accept 200,429 "**/*.md"
          fail: true
